<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/branding/xinggui-symbol.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#12265F" />
    <title>%VITE_APP_TITLE% · %VITE_INSTITUTION_NAME%</title>
    <style>
      html, body, #app { height: 100%; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB',
          'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        background: #f0f2f5;
        color: #303133;
      }
      .app-loading {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background:
          radial-gradient(circle at 20% 18%, rgba(0, 205, 255, .24), transparent 30rem),
          linear-gradient(145deg, #0D2054 0%, #102D73 58%, #071635 100%);
        color: #fff; flex-direction: column; gap: 16px;
      }
      .app-loading .logo {
        width: 76px; height: 76px; border-radius: 22px; background: rgba(255,255,255,.96);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 18px 50px rgba(0, 10, 44, .34);
        animation: pulse 1.5s ease-in-out infinite;
      }
      .app-loading .logo img { width: 66px; height: 66px; object-fit: contain; }
      @keyframes pulse { 0%,100% { transform: scale(1);} 50% { transform: scale(1.08);} }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-loading">
        <div class="logo"><img src="/branding/xinggui-symbol.png" alt="" /></div>
        <div>%VITE_APP_TITLE% 正在加载...</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
