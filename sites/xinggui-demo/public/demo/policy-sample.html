<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>制度原文示例 · 星轨智评</title><style>body{max-width:800px;margin:60px auto;padding:0 24px;font:16px/2 system-ui;color:#203c5c}aside{padding:20px;background:#fff5df;color:#98651c}h1{font-size:28px}p{margin:24px 0}a{color:#2676c9}</style><aside>这是虚构的演示材料，不是任何学校的正式制度，不用于真实计分或资格认定。</aside><h1>志愿实践材料与有效期说明（演示）</h1><p>发布单位：示例学校（演示数据） · 示例文号 DEMO-2026-01</p><p>第一条：志愿服务材料应包含主办方参与证明、本人参与内容及服务过程记录。团队材料未列出本人时，应补充成员证明。</p><p>第二条：成果证明的有效期为所选学年；跨学年经历请咨询教师，不自动累计到本期分数。</p><p>第三条：参与活动或完成成长任务，不等于自动获得综测加分，须按正式规则另行申报并审核。</p><a href="/#/policy-desk">返回制度问答 →</a></html>
